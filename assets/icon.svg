<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mindscape app icon: the diary's cloth cover at night, with a gold-foil
       constellation of five joined stars (the thoughts that keep coming back)
       and the elastic band down the right edge. -->
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2F7A"/>
      <stop offset="0.55" stop-color="#2A2256"/>
      <stop offset="1" stop-color="#4A2B5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.40" r="0.55">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="0.5" stop-color="#F2C46B"/>
      <stop offset="1" stop-color="#D9973F"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFE7A8"/>
      <stop offset="1" stop-color="#F2C46B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#cloth)"/>
  <rect width="1024" height="1024" fill="url(#weave)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- stitched border -->
  <rect x="86" y="86" width="852" height="852" rx="70" fill="none" stroke="#F2C46B" stroke-opacity="0.55" stroke-width="7" stroke-dasharray="26 20"/>
  <!-- tiny background stars -->
  <g fill="#FFFFFF">
    <circle cx="232" cy="236" r="5" opacity="0.7"/><circle cx="640" cy="196" r="4" opacity="0.6"/>
    <circle cx="300" cy="700" r="4" opacity="0.5"/><circle cx="604" cy="812" r="5" opacity="0.6"/>
    <circle cx="176" cy="512" r="3.5" opacity="0.5"/><circle cx="730" cy="420" r="3.5" opacity="0.5"/>
  </g>
  <!-- constellation lines -->
  <g stroke="url(#gold)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M262 352 L430 300 L560 450 L452 640 L300 600"/>
    <path d="M560 450 L680 330"/>
  </g>
  <!-- stars -->
  <g>
    <circle cx="430" cy="300" r="70" fill="url(#star)"/><circle cx="430" cy="300" r="26" fill="#FFF3D1"/>
    <circle cx="560" cy="450" r="92" fill="url(#star)"/><circle cx="560" cy="450" r="34" fill="#FFFFFF"/>
    <circle cx="262" cy="352" r="52" fill="url(#star)"/><circle cx="262" cy="352" r="19" fill="#FFF3D1"/>
    <circle cx="452" cy="640" r="60" fill="url(#star)"/><circle cx="452" cy="640" r="22" fill="#FFF3D1"/>
    <circle cx="300" cy="600" r="46" fill="url(#star)"/><circle cx="300" cy="600" r="16" fill="#FFF3D1"/>
    <circle cx="680" cy="330" r="48" fill="url(#star)"/><circle cx="680" cy="330" r="17" fill="#FFF3D1"/>
  </g>
  <!-- elastic band -->
  <rect x="806" y="0" width="58" height="1024" fill="#C1376C"/>
  <rect x="806" y="0" width="14" height="1024" fill="#FFFFFF" opacity="0.18"/>
  <rect x="852" y="0" width="12" height="1024" fill="#000000" opacity="0.18"/>
</svg>
